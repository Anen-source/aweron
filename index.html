<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f0e1">
<title>Aweron</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="gate-art.webp" type="image/webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{color-scheme:light;--cream:#f7f0e1;--paper:#fffaf0;--ink:#2a1b10;--muted:#7a6650;--line:#e0d1b1;--red:#8c2f1c;--red2:#a23a25;--gold:#b9791f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--cream);color:var(--ink);font:18px/1.5 "IM Fell English",Georgia,serif}
.shell{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(360px,1fr) minmax(0,1.08fr)}
/* form side */
.panel{position:relative;display:flex;flex-direction:column;padding:28px clamp(24px,5vw,64px);background:radial-gradient(90% 60% at 0% 0%,#fffbf0 0%,rgba(255,251,240,0) 70%),radial-gradient(70% 60% at 100% 100%,#f2e4c6 0%,rgba(242,228,198,0) 70%),var(--cream)}
.brand{font:400 26px "Uncial Antiqua",Georgia,serif;color:var(--red);letter-spacing:.02em}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:400px;margin:0 auto;padding:28px 0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.eyebrow{margin:0 0 10px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:400 clamp(38px,5vw,52px)/1.05 "Uncial Antiqua",Georgia,serif;color:var(--ink)}
.lead{margin:12px 0 28px;color:var(--muted);font-size:19px}.lead em{color:var(--ink)}
form{display:grid;gap:6px}
label.t{font-size:15px;color:var(--muted);margin-top:8px}
.field{position:relative}
input[type=text],input[type=password]{width:100%;min-height:52px;padding:12px 16px;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;transition:border-color .2s,box-shadow .2s,background .2s}
input[type=text]::placeholder,input[type=password]::placeholder{color:#b3a283}
input#pw{padding-right:76px}
input:hover{border-color:#cdbb94}
input:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 4px rgba(140,47,28,.14);background:#fff}
.show{position:absolute;right:6px;top:6px;min-height:40px;padding:0 12px;background:none;border:0;border-radius:8px;color:var(--red);font:inherit;font-size:15px;cursor:pointer;transition:background .2s}.show:hover{background:rgba(140,47,28,.08)}
.show:focus-visible,.go:focus-visible{outline:3px solid rgba(140,47,28,.35);outline-offset:2px}
.hint{margin:4px 0 0;color:var(--muted);font-size:15px}
.keep{display:flex;gap:10px;align-items:center;margin-top:14px;color:var(--muted);font-size:16px;min-height:32px;cursor:pointer;user-select:none}
.keep input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;border:1.5px solid #c9b78f;border-radius:6px;background:var(--paper);display:grid;place-content:center;transition:background .15s,border-color .15s;cursor:pointer}
.keep input::after{content:'';width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.keep input:checked{background:var(--red);border-color:var(--red)}.keep input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.keep input:focus-visible{outline:3px solid rgba(140,47,28,.35);outline-offset:2px}
.go{margin-top:18px;min-height:54px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;font:inherit;font-size:19px;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 20px rgba(140,47,28,.28);transition:transform .15s,box-shadow .2s,filter .2s}
.go:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(140,47,28,.34);filter:brightness(1.04)}.go:active{transform:none}
.go:disabled{opacity:.75;cursor:default;transform:none}
#err{min-height:1.6em;margin-top:14px;color:#b3402a;font-size:16px}
.bar{height:3px;margin-top:16px;background:#eadcc0;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.bar.on{opacity:1}.bar i{display:block;height:100%;width:40%;background:var(--red);animation:slide 1.1s ease-in-out infinite}
.foot{font-size:14px;color:#9a8a70;text-align:center;padding-top:8px}
/* picture side */
.art{position:relative;margin:16px 16px 16px 0;border-radius:26px;overflow:hidden;background:#1b2420;box-shadow:0 20px 60px rgba(60,40,20,.28)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:56% 50%;filter:brightness(1.1) saturate(1.06);animation:drift 26s ease-in-out infinite alternate}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,240,225,.10) 0%,rgba(20,14,8,0) 30%,rgba(20,14,8,.55) 100%)}
.art figcaption{position:absolute;z-index:2;left:clamp(20px,3vw,40px);right:20px;bottom:clamp(20px,3vw,36px);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.art q{display:block;font:italic 400 clamp(22px,2.4vw,30px)/1.25 "IM Fell English",Georgia,serif;quotes:none}
.art cite{display:block;margin-top:8px;font:400 14px "IM Fell English",Georgia,serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.main,.art img,.bar i{animation:none}.art img{transform:scale(1.04)}.go,input,.show{transition:none}}
@media (max-width:860px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .art{order:-1;margin:0;border-radius:0 0 28px 28px;height:30vh;min-height:190px;max-height:300px}
 .art img{object-position:56% 24%}
 .art figcaption{left:20px;bottom:16px}.art q{font-size:20px}.art cite{display:none}
 .panel{padding:18px 22px 22px}.brand{display:none}
 .main{justify-content:flex-start;padding:18px 0 8px}
 h1{font-size:clamp(34px,9vw,44px)}.lead{margin-bottom:20px}
}
</style></head><body>
<div class="shell">
 <section class="panel">
  <div class="brand">Aweron</div>
  <main class="main">
   <p class="eyebrow">Aweron Legacy &middot; Book One</p>
   <h1>Welcome back</h1>
   <p class="lead">Sign in to keep reading <em>Dragonsong</em>.</p>
   <form id="f" novalidate>
    <label class="t" for="nm">Name</label>
    <input id="nm" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your name" autofocus>
    <label class="t" for="pw">Password</label>
    <div class="field"><input id="pw" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="show" id="show" aria-label="Show password">Show</button></div>
    <p class="hint">Readers: use the name and password you were sent.</p>
    <label class="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
    <button class="go" id="go">Open the book</button>
   </form>
   <div class="bar" id="bar" aria-hidden="true"><i></i></div><div id="err" role="alert"></div>
  </main>
  <div class="foot">An early draft, shared privately. Please do not share it further.</div>
 </section>
 <figure class="art"><img src="gate-art.webp" alt="" width="1400" height="1344" fetchpriority="high" decoding="async"><figcaption><q>Some songs have to be earned.</q><cite>Dragonsong</cite></figcaption></figure>
</div>
<script>
// Start downloading while the password is being typed
const pre=fetch('site.enc.json').then(r=>r.json());pre.catch(()=>{});
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),te=new TextEncoder();
const hex=buf=>[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(pw,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.importKey('raw',await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256),'AES-GCM',false,['decrypt'])}
async function unlock(name,pw,keep){
  const d=await pre,n=name.trim().toLowerCase();
  const id=n==='admin-anurag'?'admin':n?hex(await crypto.subtle.digest('SHA-256',te.encode('u:'+n))).slice(0,16):'none',slot=d.slots[id];
  if(!slot){await derive(pw,new Uint8Array(16),d.iter);throw 'bad'}   // same delay as a real attempt
  let roleKey;try{roleKey=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(slot.iv)},await derive(pw,b64(slot.salt),d.iter),b64(slot.w))}catch(_){throw 'bad'}
  const r=d.roles[slot.role],key=await crypto.subtle.importKey('raw',roleKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(r.iv)},key,b64(r.ct));
  const p=JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  window.AW_USER={name:name.trim(),role:slot.role,p:pw};
  window.AW={role:slot.role,view:slot.role,name:name.trim(),pw,d,p,roleKey:new Uint8Array(roleKey),loadedAdminCt:d.roles.admin.ct};
  (0,eval)(p.story);
  if(keep)ls.set('aw',JSON.stringify({n:name,p:pw}));else ls.del('aw');
  document.open();document.write(p.html);document.close();
}
const $=i=>document.getElementById(i),f=$('f'),err=$('err'),go=$('go'),bar=$('bar'),pwi=$('pw');
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
function busy(on){go.disabled=on;go.textContent=on?'Opening the book...':'Open the book';bar.classList.toggle('on',on)}
$('show').onclick=()=>{const t=pwi.type==='password';pwi.type=t?'text':'password';$('show').textContent=t?'Hide':'Show'};
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const pw=pwi.value;if(!$('nm').value.trim()){err.textContent='Type your name first.';return}if(!pw){err.textContent='Type the password first.';return}busy(true);
  try{await unlock($('nm').value,pw,$('keep').checked)}
  catch(x){busy(false);if(x==='bad')ls.del('aw');err.textContent=x==='bad'?'That name or password did not work.':'Could not load the story. Check your connection and try again.';err.scrollIntoView({block:'nearest',behavior:'smooth'})}});
const inv=location.hash.match(/^#in=([\w-]+)$/);let linked=false;
if(inv){try{const c=JSON.parse(decodeURIComponent(escape(atob(inv[1].replace(/-/g,'+').replace(/_/g,'/')))));$('nm').value=c.n||'';pwi.value=c.p||'';linked=!!pwi.value}catch(_){}history.replaceState(null,'',location.pathname+location.search);if(linked)f.requestSubmit()}
let saved=linked?null:ls.get('aw');if(saved){let c;try{c=JSON.parse(saved)}catch(_){c=null}if(!c||typeof c!=='object')c={n:'',p:saved};$('nm').value=c.n||(c.p?'Admin-Anurag':'');pwi.value=c.p||'';if(pwi.value)f.requestSubmit()}
</script></body></html>
