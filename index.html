<script>
/* AWCORE: one implementation of the encryption and library rules, used by build.mjs (Node) and by the pages (browser).
   Site format v3: { v, iter, app, admin, books:{id:{card,text}}, slots:{id:{role,salt,iv,w}} }
   - Each book has two keys: c (its card: title, cover, chapter ids) and t (its text). A reader's slot wraps a keyring {a, c:{}, t:{}}.
   - Book audience: everyone (all readers), invited (only readers ticked), soon (everyone sees a Coming soon card, nobody reads), hidden (writer only). */
(function(g){
const te=new TextEncoder(),td=new TextDecoder(),S=()=>g.crypto.subtle,rnd=n=>g.crypto.getRandomValues(new Uint8Array(n));
const toB64=u=>{if(typeof Buffer!=='undefined')return Buffer.from(u).toString('base64');let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=b=>typeof Buffer!=='undefined'?new Uint8Array(Buffer.from(b,'base64')):Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const keyOf=k=>typeof k==='string'?fromB64(k):k,aes=(raw,use)=>S().importKey('raw',raw,'AES-GCM',false,use);
async function pbk(pw,salt,iter){const base=await S().importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await S().deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256))}
async function pipe(u8,Ctor,kind){const st=new Ctor(kind),w=st.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(st.readable).arrayBuffer())}
const gz=u8=>pipe(u8,CompressionStream,'gzip'),gunz=u8=>pipe(u8,DecompressionStream,'gzip');
async function seal(key,obj){const iv=rnd(12),ct=new Uint8Array(await S().encrypt({name:'AES-GCM',iv},await aes(keyOf(key),['encrypt']),await gz(te.encode(JSON.stringify(obj)))));return{iv:toB64(iv),ct:toB64(ct)}}
async function unseal(key,o){return JSON.parse(td.decode(await gunz(new Uint8Array(await S().decrypt({name:'AES-GCM',iv:fromB64(o.iv)},await aes(keyOf(key),['decrypt']),fromB64(o.ct))))))}
async function wrap(pw,raw,iter,role){const salt=rnd(16),iv=rnd(12),w=new Uint8Array(await S().encrypt({name:'AES-GCM',iv},await aes(await pbk(pw,salt,iter),['encrypt']),raw));return{role,salt:toB64(salt),iv:toB64(iv),w:toB64(w)}}
async function unwrap(pw,slot,iter){return new Uint8Array(await S().decrypt({name:'AES-GCM',iv:fromB64(slot.iv)},await aes(await pbk(pw,fromB64(slot.salt),iter),['decrypt']),fromB64(slot.w)))}
async function uid(name){const h=new Uint8Array(await S().digest('SHA-256',te.encode('u:'+name.toLowerCase().trim())));return [...h.slice(0,8)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const newKey=()=>toB64(rnd(32));
function ensureKeys(cfg){cfg.keys=cfg.keys||{};cfg.keys.app=cfg.keys.app||newKey();cfg.keys.books=cfg.keys.books||{};for(const b of cfg.meta.books)cfg.keys.books[b.id]=cfg.keys.books[b.id]||{c:newKey(),t:newKey()}}
function rotateKeys(cfg){cfg.keys={app:newKey(),books:{}};ensureKeys(cfg)}
/* ---- books ---- */
const over=(cfg,id)=>((cfg.settings||{}).books||{})[id]||{};
const bookOf=(cfg,b)=>Object.assign({},b,{title:over(cfg,b.id).title||b.title,series:over(cfg,b.id).series==null?b.series:over(cfg,b.id).series,tagline:over(cfg,b.id).tagline==null?b.tagline:over(cfg,b.id).tagline,description:over(cfg,b.id).description==null?b.description:over(cfg,b.id).description});
const audience=(cfg,b)=>over(cfg,b.id).audience||(b.id===cfg.meta.defaultBook?'everyone':'hidden');
const chaptersOf=(story,cfg,b)=>story.chapters.filter(c=>(c.book||cfg.meta.defaultBook)===b.id);
const visible=(c,cfg)=>{const v=((cfg.settings||{}).chapters||{})[c.id];return v==='show'?true:v==='hide'?false:!/^New/.test(c.status)};
function can(u,b,cfg){const a=audience(cfg,b);return a==='everyone'?'read':a==='invited'?((u.books||[]).includes(b.id)?'read':null):a==='soon'?'card':null}
function keyringFor(u,cfg){const r={a:cfg.keys.app,c:{},t:{}};for(const b of cfg.meta.books){const l=can(u,b,cfg);if(l){r.c[b.id]=cfg.keys.books[b.id].c;if(l==='read')r.t[b.id]=cfg.keys.books[b.id].t}}return r}
async function sealBooks(cfg,story,only){const out={};for(const base of cfg.meta.books){if(only&&!only.includes(base.id))continue;const b=bookOf(cfg,base),chs=chaptersOf(story,cfg,b).filter(c=>visible(c,cfg));
  const card={id:b.id,title:b.title,series:b.series||'',number:b.number||0,tagline:b.tagline||'',author:b.author||'',description:b.description||'',cover:b.coverUrl,thumb:b.thumbUrl,ids:chs.map(c=>c.id),count:chs.length,words:chs.reduce((n,c)=>n+(c.words||0),0)};
  out[b.id]={card:await seal(cfg.keys.books[b.id].c,card),text:await seal(cfg.keys.books[b.id].t,{chapters:chs.map(c=>({id:c.id,part:c.part,title:c.title,text:c.text,words:c.words}))})}}return out}
const sealApp=(cfg,html)=>seal(cfg.keys.app,{html,welcome:(cfg.settings||{}).welcome||'',endNote:(cfg.settings||{}).endNote||''});
const sealAdmin=(key,payload)=>seal(key,payload);
const makeSlot=(u,cfg,iter)=>uid(u.name).then(async id=>[id,await wrap(u.password,te.encode(JSON.stringify(keyringFor(u,cfg))),iter,'reader')]);
async function makeSlots(cfg,adminKey,adminPw,iter,progress){const slots={admin:await wrap(adminPw,keyOf(adminKey),iter,'admin')};let i=0;for(const u of cfg.users){progress&&progress(++i,cfg.users.length);const[id,s]=await makeSlot(u,cfg,iter);slots[id]=s}return slots}
g.AWCORE={seal,unseal,wrap,unwrap,uid,toB64,fromB64,newKey,ensureKeys,rotateKeys,bookOf,audience,chaptersOf,visible,can,keyringFor,sealBooks,sealApp,sealAdmin,makeSlot,makeSlots,te,td};
})(typeof globalThis!=='undefined'?globalThis:window);
</script>
<style>
:root{color-scheme:light;--bg:#e9e7dc;--side:#faf9f5;--ink:#1d2030;--ink2:#3e4153;--mute:#8a8a84;--line:#dedccf;--accent:#e5565c;--accent2:#d44a50;--serif:"Newsreader",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
.shell{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,29vw,560px)}
.panel{position:relative;display:flex;flex-direction:column;padding:26px clamp(24px,5vw,64px);background:var(--side)}
.brand{display:flex;align-items:center;gap:10px;font:500 24px var(--serif);color:var(--ink);letter-spacing:.01em}.brand img{width:38px;height:38px;display:block}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:410px;margin:0 auto;padding:28px 0 56px;text-align:center;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.mark{width:64px;height:64px;margin:0 auto 18px;display:block}
h1{margin:0;font:500 clamp(36px,4.2vw,48px)/1.08 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.lead{margin:10px 0 30px;color:var(--mute);font-size:16px}
form{display:grid;gap:6px}
label.t{font-size:13px;font-weight:600;color:var(--ink2);margin-top:8px;text-align:left;letter-spacing:.02em}
.field{position:relative}
input[type=text],input[type=password]{width:100%;min-height:54px;padding:12px 18px;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#a9a9a1}
input#pw{padding-right:76px}
input:hover{border-color:#cfcdbf}
input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(29,32,48,.08)}
.show{position:absolute;right:6px;top:7px;min-height:40px;padding:0 12px;background:none;border:0;border-radius:8px;color:var(--ink2);font:600 13px var(--sans);cursor:pointer;transition:background .2s}.show:hover{background:rgba(29,32,48,.06)}
.show:focus-visible,.go:focus-visible{outline:3px solid rgba(229,86,92,.4);outline-offset:2px}
.hint{margin:8px 0 0;color:var(--mute);font-size:13px}
.keep{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;color:var(--ink2);font-size:14px;min-height:32px;cursor:pointer;user-select:none}
.keep input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;border:1.5px solid #c4c2b4;border-radius:6px;background:#fff;display:grid;place-content:center;transition:background .15s,border-color .15s;cursor:pointer}
.keep input::after{content:'';width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.keep input:checked{background:var(--accent);border-color:var(--accent)}.keep input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.keep input:focus-visible{outline:3px solid rgba(229,86,92,.4);outline-offset:2px}
.go{margin-top:20px;min-height:56px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 16px var(--sans);letter-spacing:.01em;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 10px 24px rgba(29,32,48,.22)}
.go:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(29,32,48,.3);background:#2a2e45}.go:active{transform:none}
.go:disabled{opacity:.75;cursor:default;transform:none}
#err{min-height:1.6em;margin-top:14px;color:#c8454b;font-size:14px}
.bar{height:3px;margin-top:16px;background:#e4e2d6;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.bar.on{opacity:1}.bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
.foot{font-size:12px;color:#a2a198;text-align:center;padding-top:8px}
.art{position:relative;margin:0;overflow:hidden;background:#1b2420}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:26% 42%;filter:brightness(1.1) saturate(1.06);animation:drift 26s ease-in-out infinite alternate}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,8,0) 55%,rgba(20,14,8,.6) 100%)}
.art figcaption{position:absolute;z-index:2;left:22px;right:22px;bottom:20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55);font-size:13px;line-height:1.3}
.art figcaption span:last-child{opacity:.8;text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.main,.art img,.bar i{animation:none}.art img{transform:scale(1.04)}.go,input,.show{transition:none}}
@media (max-width:860px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .art{order:-1;border-radius:0 0 28px 28px;height:30vh;min-height:190px;max-height:300px}
 .art img{object-position:50% 30%}
 .art figcaption{left:18px;right:18px;bottom:14px}.art figcaption span:last-child{display:none}
 .panel{padding:18px 22px 22px}.brand{display:none}
 .main{justify-content:flex-start;padding:18px 0 8px}
 .mark{width:52px;height:52px;margin-bottom:12px}h1{font-size:clamp(32px,9vw,42px)}.lead{margin-bottom:20px}
}
</style></head><body>
<div class="shell">
 <section class="panel">
  <div class="brand"><img src="logo.svg" alt="" width="38" height="38">Aweron</div>
  <main class="main">
   <img class="mark" src="logo.svg" alt="" width="64" height="64">
   <h1>Welcome back</h1>
   <p class="lead">Sign in to keep reading.</p>
   <form id="f" novalidate>
    <label class="t" for="nm">Name</label>
    <input id="nm" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your name" autofocus>
    <label class="t" for="pw">Password</label>
    <div class="field"><input id="pw" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="show" id="show" aria-label="Show password">Show</button></div>
    <p class="hint">Readers: use the name and password you were sent.</p>
    <label class="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
    <button class="go" id="go">Continue</button>
   </form>
   <div class="bar" id="bar" aria-hidden="true"><i></i></div><div id="err" role="alert"></div>
  </main>
  <div class="foot">A private library. Please do not share what you read here.</div>
 </section>
 <figure class="art"><picture><source media="(max-width:860px)" srcset="gate-art-wide.webp"><img src="gate-art.webp" alt="" width="900" height="1404" fetchpriority="high" decoding="async"></picture><figcaption><span>Stories from the world of Aweron</span><span>Dragonsong, cover art</span></figcaption></figure>
</div>
<script>
// Start downloading while the password is being typed
const pre=fetch('site.enc.json').then(r=>r.json());pre.catch(()=>{});
async function unlock(name,pw,keep){
  const d=await pre,n=name.trim().toLowerCase();
  const id=n==='admin-anurag'?'admin':n?await AWCORE.uid(n):'none',slot=d.slots[id];
  if(!slot){try{await AWCORE.unwrap(pw,{salt:'AAAAAAAAAAAAAAAAAAAAAA==',iv:'AAAAAAAAAAAAAAAA',w:'AAAA'},d.iter)}catch(_){}throw 'bad'}   // same delay as a real attempt
  let raw;try{raw=await AWCORE.unwrap(pw,slot,d.iter)}catch(_){throw 'bad'}
  window.AW_USER={name:name.trim(),role:slot.role,p:pw};let html;
  if(slot.role==='admin'){const p=await AWCORE.unseal(raw,d.admin);window.AW={role:'admin',view:'admin',name:name.trim(),pw,d,p,roleKey:raw,loadedAdminCt:d.admin.ct};(0,eval)(p.story);html=p.html}
  else{const ring=JSON.parse(AWCORE.td.decode(raw)),app=await AWCORE.unseal(ring.a,d.app);window.AW={role:'reader',view:'reader',name:name.trim(),pw,d,keys:ring,app};html=app.html}
  if(keep)ls.set('aw',JSON.stringify({n:name,p:pw}));else ls.del('aw');
  document.open();document.write(html);document.close();
}
const $=i=>document.getElementById(i),f=$('f'),err=$('err'),go=$('go'),bar=$('bar'),pwi=$('pw');
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
function busy(on){go.disabled=on;go.textContent=on?'Opening...':'Continue';bar.classList.toggle('on',on)}
$('show').onclick=()=>{const t=pwi.type==='password';pwi.type=t?'text':'password';$('show').textContent=t?'Hide':'Show'};
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const pw=pwi.value;if(!$('nm').value.trim()){err.textContent='Type your name first.';return}if(!pw){err.textContent='Type the password first.';return}busy(true);
  try{await unlock($('nm').value,pw,$('keep').checked)}
  catch(x){busy(false);if(x==='bad')ls.del('aw');err.textContent=x==='bad'?'That name or password did not work.':'Could not load the story. Check your connection and try again.';err.scrollIntoView({block:'nearest',behavior:'smooth'})}});
const inv=location.hash.match(/^#in=([\w-]+)$/);let linked=false;
if(inv){try{const c=JSON.parse(decodeURIComponent(escape(atob(inv[1].replace(/-/g,'+').replace(/_/g,'/')))));$('nm').value=c.n||'';pwi.value=c.p||'';linked=!!pwi.value}catch(_){}history.replaceState(null,'',location.pathname+location.search);if(linked)f.requestSubmit()}
let saved=linked?null:ls.get('aw');if(saved){let c;try{c=JSON.parse(saved)}catch(_){c=null}if(!c||typeof c!=='object')c={n:'',p:saved};$('nm').value=c.n||(c.p?'Admin-Anurag':'');pwi.value=c.p||'';if(pwi.value)f.requestSubmit()}
</script></body></html>
