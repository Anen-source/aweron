<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2c2118">
<title>Aweron</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{--bg:#2c2118;--card:#3a2c20;--ink:#eadfc8;--mute:#b9a888;--line:#6b4a2c;--gold:#e0a24a;--red:#8c2f1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#3f2f21,var(--bg) 70%);color:var(--ink);font:18px/1.45 "IM Fell English",Georgia,serif;padding:16px}
main{width:100%;max-width:380px;text-align:center}
h1{font:400 clamp(40px,12vw,56px)/1 "Uncial Antiqua",Georgia,serif;margin:0 0 8px;color:var(--gold)}
p.sub{color:var(--mute);margin:0 0 26px;font-style:italic}
form{display:grid;gap:12px;text-align:left}
.field{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 74px 12px 14px;min-height:48px;border:1px solid var(--line);border-radius:6px;background:#241a12;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.show{position:absolute;right:4px;top:4px;min-height:40px;padding:0 12px;background:none;border:0;color:var(--gold);font:inherit;font-size:15px;cursor:pointer}
.hint{color:var(--mute);font-size:14px;margin:-4px 0 0}
.keep{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:16px;min-height:32px;cursor:pointer}
.keep input{width:20px;height:20px;accent-color:var(--red)}
.go{font:inherit;font-size:19px;min-height:50px;border:0;border-radius:6px;background:var(--red);color:#fff;cursor:pointer}
.go:disabled{opacity:.7;cursor:default}
#err{min-height:1.5em;margin-top:14px;color:#e58a6c;font-size:16px}
.bar{height:3px;margin-top:18px;background:#241a12;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.bar.on{opacity:1}.bar i{display:block;height:100%;width:40%;background:var(--gold);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style></head><body><main>
<h1>Aweron</h1><p class="sub">A story in progress. Enter the password to read.</p>
<form id="f"><div class="field"><input id="nm" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Name" aria-label="Name" style="padding-right:14px"></div><div class="field"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" autofocus><button type="button" class="show" id="show" aria-label="Show password">Show</button></div>
<p class="hint">Readers: use the name and password you were sent.</p>
<label class="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
<button class="go" id="go">Open</button></form>
<div class="bar" id="bar" aria-hidden="true"><i></i></div><div id="err" role="alert"></div>
</main><script>
// Start downloading while the password is being typed
const pre=fetch('site.enc.json').then(r=>r.json());pre.catch(()=>{});
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),te=new TextEncoder();
const hex=buf=>[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(pw,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.importKey('raw',await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256),'AES-GCM',false,['decrypt'])}
async function unlock(name,pw,keep){
  const d=await pre,n=name.trim().toLowerCase();
  const id=n?hex(await crypto.subtle.digest('SHA-256',te.encode('u:'+n))).slice(0,16):'admin',slot=d.slots[id];
  if(!slot){await derive(pw,new Uint8Array(16),d.iter);throw 'bad'}   // same delay as a real attempt
  let roleKey;try{roleKey=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(slot.iv)},await derive(pw,b64(slot.salt),d.iter),b64(slot.w))}catch(_){throw 'bad'}
  const r=d.roles[slot.role],key=await crypto.subtle.importKey('raw',roleKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(r.iv)},key,b64(r.ct));
  const p=JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  window.AW_USER={name:name.trim(),role:slot.role,p:pw};
  (0,eval)(p.story);
  if(keep)ls.set('aw',JSON.stringify({n:name,p:pw}));else ls.del('aw');
  document.open();document.write(p.html);document.close();
}
const $=i=>document.getElementById(i),f=$('f'),err=$('err'),go=$('go'),bar=$('bar'),pwi=$('pw');
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
function busy(on){go.disabled=on;go.textContent=on?'Opening...':'Open';bar.classList.toggle('on',on)}
$('show').onclick=()=>{const t=pwi.type==='password';pwi.type=t?'text':'password';$('show').textContent=t?'Hide':'Show'};
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const pw=pwi.value;if(!pw){err.textContent='Type the password first.';return}busy(true);
  try{await unlock($('nm').value,pw,$('keep').checked)}
  catch(x){busy(false);if(x==='bad')ls.del('aw');err.textContent=x==='bad'?'That password did not work.':'Could not load the story. Check your connection and try again.'}});
let saved=ls.get('aw');if(saved){let c;try{c=JSON.parse(saved)}catch(_){c=null}if(!c||typeof c!=='object')c={n:'',p:saved};$('nm').value=c.n||'';pwi.value=c.p||'';if(pwi.value)f.requestSubmit()}
</script></body></html>
