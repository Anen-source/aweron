<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Aweron</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--ink:#2b2118;--mute:#6b5b48;--line:#c9b794;--btn:#5a3a1e}
@media (prefers-color-scheme:dark){:root{--bg:#17120d;--ink:#eadfc8;--mute:#a8987e;--line:#4a3d2c;--btn:#c9a45c}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,serif;padding:16px}
main{width:100%;max-width:360px;text-align:center}h1{font-family:'Uncial Antiqua',serif;font-weight:400;font-size:2rem;margin:0 0 6px}
p{color:var(--mute);margin:0 0 20px}form{display:grid;gap:10px}
input{font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
button{font:inherit;font-size:1.1rem;padding:10px;border:0;border-radius:6px;background:var(--btn);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}#err{min-height:1.4em;margin-top:10px;color:#b3472f}
</style></head><body><main>
<h1>Aweron</h1><p>Enter the password to read.</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus><button id="go">Open</button></form><div id="err" role="alert"></div>
</main><script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const d=await (await fetch('story.enc.json')).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.salt),iterations:d.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},key,b64(d.ct));
  (0,eval)(new TextDecoder().decode(pt));
  const html=await (await fetch('app.html')).text();
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Opening...';
  const pw=document.getElementById('pw').value;
  try{await unlock(pw);try{sessionStorage.setItem('aw',pw)}catch(_){}}
  catch(x){err.textContent='That password did not work.';go.disabled=false;go.textContent='Open'}});
try{const p=sessionStorage.getItem('aw');if(p){document.getElementById('pw').value=p;f.requestSubmit()}}catch(_){}
</script></body></html>
